<!DOCTYPE html>
<html>

<head>
    <title>SBCA PS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: black;
        }

        header {
            background-color: orange;
            font-weight: bold;

            height: 100px;
            /* give space */

            display: flex;
            /* turn on flexbox */

            justify-content: center;
            /* horizontal center */

            align-items: center;
        }

        h1 {
            font-size: 40px;

            margin: 0;
        }

        video {
            border-radius: 10px;

            height: 200px;
            background-color: white;
        }

        div {
            vertical-align: top;
            height: 300px;

            display: inline-block;

            border-radius: 10px;

            margin-top: 30px;
            margin-left: 30px;

            box-shadow: 0px 0px 5px 3px rgb(255, 255, 255, 0.4);
        }

        .title {
            font-size: 16px;
            font-weight: bold;

            margin-left: 10px;
            margin-top: 5px;
            color: white;

            width: 280px;
        }

        .views {
            font-size: 12px;
            color: white;

            margin-left: 10px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <header>
        <h1>SBCA PS</h1>

        <img src="" alt="">
    </header>

    <div>
        <video width="300px" controls>
            <source src="derek.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <p class="title">Bogart bimomba ni JP, napa-WOW!</p>
        <p class="views">4 views</p>
    </div>

    <div>
        <video width="300px" controls>
            <source src="jp.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <p class="title">Tinikman ni JP ang specialty ng Malabon</p>
        <p class="views">1M views</p>
    </div>
</body>

</html>
